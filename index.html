<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jam Dinding Indonesia</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>JAM INDONESIA By Adhit</h1>

    <p class="tanggal" id="dateText">
      Memuat tanggal...
    </p>

    <div class="clock">

      <!-- Angka -->
      <div class="number n12">12</div>
      <div class="number n1">1</div>
      <div class="number n2">2</div>
      <div class="number n3">3</div>
      <div class="number n4">4</div>
      <div class="number n5">5</div>
      <div class="number n6">6</div>
      <div class="number n7">7</div>
      <div class="number n8">8</div>
      <div class="number n9">9</div>
      <div class="number n10">10</div>
      <div class="number n11">11</div>

      <!-- Jarum -->
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
      <div class="hand second" id="secondHand"></div>

      <div class="center"></div>

    </div>

    <div class="digital">

      <span id="digitalTime">00:00:00</span>

      <small>WIB • Asia/Jakarta</small>

    </div>

    <div class="newsBox">

      <div class="newsHeader">

        <span class="live"></span>

        <h2>BERITA HOT INDONESIA</h2>

      </div>

      <div class="newsTime" id="newsTime">
        Memuat berita...
      </div>

      <div class="ticker">

        <div id="newsText" class="tickerText">

          Menghubungkan ke berita terbaru Indonesia...

        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
